interface:
  display_name: "Symbraid Search"
  short_description: "Host-neutral semantic and verified code search"
  default_prompt: "Use $symbraid-search to locate code semantically and verify it before making changes."
dependencies:
  tools:
    - type: "mcp"
      value: "io.github.wcotito/symbraid"
      description: "Symbraid semantic index and search tools"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
