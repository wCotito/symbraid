interface:
  display_name: "Hybrid Code Search"
  short_description: "Semantic and verified local code search"
  default_prompt: "Use $hybrid-code-search to locate code semantically and verify it before making changes."
dependencies:
  tools:
    - type: "mcp"
      value: "hybrid-code-search"
      description: "Independent Qdrant semantic index and search tools"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
