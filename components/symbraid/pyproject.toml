[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symbraid"
version = "0.3.0"
description = "Cross-platform semantic code index with a read-only MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Symbraid Contributors"}]
dependencies = [
  "fastembed>=0.7,<1",
  "keyring>=25,<26",
  "lancedb>=0.37,<0.38",
  "mcp>=1.13,<2",
  "tree-sitter-language-pack>=0.9,<1",
  "uvicorn>=0.30,<1",
  "watchfiles>=1,<2",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "jsonschema>=4.23,<5"]

[project.scripts]
symbraid = "symbraid.cli:main"
symbraid-mcp = "symbraid.mcp_server:main"
code-index = "symbraid.cli:legacy_main"
code-index-mcp = "symbraid.mcp_server:legacy_main"

[tool.setuptools.packages.find]
where = ["src"]
