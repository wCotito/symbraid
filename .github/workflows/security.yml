name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Full dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install audit tools
        run: python -m pip install uv==0.11.15 pip-audit==2.10.1
      - name: Check Python lock consistency
        run: uv lock --check --project components/symbraid
      - name: Audit every locked Python variant and extra
        run: |
          mkdir -p "$RUNNER_TEMP/symbraid-audit"
          uv export --project components/symbraid --frozen --all-extras --no-emit-project \
            --format pylock.toml --output-file "$RUNNER_TEMP/symbraid-audit/pylock.toml"
          pip-audit --locked "$RUNNER_TEMP/symbraid-audit" --vulnerability-service osv
      - name: Audit all npm dependencies, including development tools
        run: npm audit --package-lock-only --prefix extensions/vscode-symbraid

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5

  docs-policy:
    name: Documentation policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/sync_docs.py --check

