name: Bug report
description: Report a reproducible problem in Symbraid
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Please remove credentials, tokens, private source text, and personal
        paths before submitting. Security-sensitive reports belong in
        SECURITY.md, not a public issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core and indexing
        - CLI
        - MCP server
        - VS Code integration
        - Codex integration
        - Documentation
        - Benchmarks
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the smallest safe steps or attach a minimal public fixture.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Symbraid version/commit, and client versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Safe logs
      description: Paste redacted logs. Never include secrets or private source code.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, tokens, private paths, and sensitive source text.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
